# Caller: lint, tests and the full-history secret scan on every pull request and push to main.
# Required checks for the main ruleset: "ci / lint-test" and "secrets / gitleaks".
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    permissions:
      contents: read

  secrets:
    uses: ./.github/workflows/reusable-gitleaks.yml
    permissions:
      contents: read
